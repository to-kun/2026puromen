<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="小出市役所ウェブサイトで発見された異変の記録一覧ページです。">
    <title>小出市役所 発見した異変アーカイブ</title>
    <!-- CSSのパスを static/css/style.css に変更（配置場所に合わせて調整） -->
    <link rel="stylesheet" href="./static/css/style.css">
  </head>
  <body class="archive-page">
    <!-- 官公庁風ヘッダー -->
    <header class="archive-header">
      <div class="header-inner">
        <h1>小出市役所 <span class="sub-title">発見した異変アーカイブ</span></h1>
        <p class="notice-text">（※このページ内に異変はありません）</p>
        <button type="button" class="btn-back" onclick="window.close();">✕ タブを閉じる</button>
      </div>
    </header>

    <!-- 統計・収集率エリア -->
      <section class="stats-section">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h2>図鑑収集状況</h2>
          <button type="button" id="btn-reset-archive" class="btn-back" style="color: #c53030; border-color: #feb2b2;">図鑑をリセット</button>
        </div>
        <div class="stats-box">
          <div class="stats-count">
            発見数: <span id="unlocked-count">0</span> / <span id="total-count">0</span>
          </div>
          <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
          </div>
          <div id="progress-percent" class="stats-percent">0%</div>
        </div>
      </section>

      <!-- フィルタータグ -->
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">すべて</button>
        <button class="filter-btn" data-filter="unlocked">発見済み</button>
        <button class="filter-btn" data-filter="locked">未発見</button>
      </div>

      <section class="gallery-section">
        <div id="anomaly-grid" class="anomaly-grid"></div>
      </section>
      <button type="button" class="btn-back" onclick="window.close();">✕ タブを閉じる</button>
    </main>

    <footer class="archive-footer">
      <p>小出市役所 異変調査課 （※このページ内に異変はありません）</p>
    </footer>

    <!-- JSファイルの読み込み -->
    <script src="./static/js/storage.js"></script>
    <script src="./static/js/archive.js" defer></script>
  </body>
</html>
